name: Render SKILLPIPS Cinematic Promo

on:
  push:
    branches:
      - claude/skillpips-promo-video-umu8r8
    paths:
      - "remotion/**"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  render:
    name: Render MP4 (1920×1080 · 30fps · 60s)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: remotion
        run: npm ci

      - name: Render video
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render SkillpipsAd out/skillpips-promo.mp4 \
            --codec=h264 \
            --jpeg-quality=96 \
            --overwrite \
            --log=verbose

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillpips-promo-mp4
          path: remotion/out/skillpips-promo.mp4
          retention-days: 30
