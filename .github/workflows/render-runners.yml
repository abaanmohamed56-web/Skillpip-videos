name: Render Runners Motivational TikTok

on:
  push:
    branches:
      - claude/remotion-runners-tiktok-ybrb08
    paths:
      - "remotion/**"
      - ".github/workflows/render-runners.yml"
  workflow_dispatch: # allow manual trigger from the GitHub UI

jobs:
  render:
    name: Render MP4 (1080×1920 · 60fps · 45s · Three.js)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: remotion
        run: npm ci

      - name: Render video
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render RunnersTikTok out/runners-tiktok.mp4 \
            --codec=h264 \
            --gl=swangle \
            --jpeg-quality=95 \
            --concurrency=2 \
            --overwrite \
            --log=verbose

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: runners-tiktok-mp4
          path: remotion/out/runners-tiktok.mp4
          retention-days: 30
